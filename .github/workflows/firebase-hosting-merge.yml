name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Set up Flutter manually
      - name: Set up Flutter
        run: |
          # Install Flutter dependencies manually
          git clone https://github.com/flutter/flutter.git -b stable --depth 1
          echo "$GITHUB_ENV" >> $GITHUB_ENV
          echo "FLUTTER_HOME=$PWD/flutter" >> $GITHUB_ENV
          echo "$FLUTTER_HOME/bin" >> $GITHUB_PATH
          flutter doctor

      # Step 3: Install Flutter dependencies
      - name: Install dependencies
        run: flutter pub get

      # Step 4: Build Flutter web app
      - name: Build Flutter web
        run: flutter build web

      # Step 5: Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_REQUISITION_SYSTEM_FINALE }}"
          projectId: requisition-system-finale
          channelId: live

      # Optional: Cache Flutter dependencies
      - name: Cache Flutter dependencies
        uses: actions/cache@v2
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-
