# This workflow handles the build and deployment of a Flutter web app to Firebase Hosting
name: Deploy to Firebase Hosting

# Trigger the workflow on push to main branch
on:
  push:
    branches:
      - main
  # Optional: Also trigger on pull requests to main
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Flutter environment
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'  # Specify your Flutter version
          channel: 'stable'
          cache: true

      # Step 3: Verify Flutter installation
      - name: Verify Flutter installation
        run: flutter --version

      # Step 4: Install dependencies
      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      # Step 5: Run tests (if you have any)
      - name: Run tests
        run: flutter test || true

      # Step 6: Build web app
      - name: Build web app
        run: flutter build web --release

      # Step 7: Install Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Step 8: Deploy to Firebase
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_REQUISITION_SYSTEM_FINALE }}'
          projectId: requisition-system-finale
          channelId: live
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels